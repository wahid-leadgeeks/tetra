<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — TETRA</title>
    <style>
      :root {
        --background: #09090b;
        --surface: #18181b;
        --surface-border: #27272a;
        --foreground: #fafafa;
        --muted: #a1a1aa;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: var(--background);
        color: var(--foreground);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        text-align: center;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--surface-border);
        border-radius: 1rem;
        padding: 2.5rem 2rem;
        max-width: 440px;
        width: 100%;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      }
      .icon-container {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 4rem;
        height: 4rem;
        border-radius: 9999px;
        background: rgba(37, 99, 235, 0.12);
        color: #60a5fa;
        margin-bottom: 1.5rem;
      }
      h1 {
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 0.75rem;
      }
      p {
        color: var(--muted);
        font-size: 0.925rem;
        line-height: 1.5;
        margin-bottom: 1.75rem;
      }
      .retry-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 0.75rem 1.25rem;
        border-radius: 0.5rem;
        background: var(--primary);
        color: #ffffff;
        font-weight: 600;
        font-size: 0.9rem;
        border: none;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }
      .retry-btn:hover {
        background: var(--primary-hover);
      }
      .status-pill {
        display: inline-block;
        margin-top: 1.25rem;
        font-size: 0.75rem;
        color: var(--muted);
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon-container">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
      <h1>Connection Offline</h1>
      <p>
        TETRA is running disconnected from the network. Your active timers and attendance will resume syncing when the connection is restored.
      </p>
      <button class="retry-btn" onclick="window.location.reload()">
        Try Reconnecting
      </button>
      <div class="status-pill">
        TETRA Companion Offline Shell
      </div>
    </div>
  </body>
</html>
