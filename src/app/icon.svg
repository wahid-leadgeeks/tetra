<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="tetra-g-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="tetra-g-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="tetra-g-mid" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="tetra-g-bottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="tetra-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle for tab contrast -->
  <rect width="32" height="32" rx="7" fill="url(#tetra-bg)" stroke="#1e293b" stroke-width="0.8" />

  <!-- Top Left wing facet -->
  <polygon
    points="16,6 4,13 13.5,15"
    fill="url(#tetra-g-left)"
    stroke="#4f46e5"
    stroke-width="0.5"
  />

  <!-- Top Right wing facet -->
  <polygon
    points="16,6 28,13 18.5,15"
    fill="url(#tetra-g-right)"
    stroke="#6366f1"
    stroke-width="0.5"
  />

  <!-- Top Center apex facet -->
  <polygon
    points="16,6 13.5,15 18.5,15"
    fill="url(#tetra-g-mid)"
  />

  <!-- Bottom Faceted Diamond (T-stem) -->
  <polygon
    points="16,16 11,21.5 16,27.5 21,21.5"
    fill="url(#tetra-g-bottom)"
    stroke="#4f46e5"
    stroke-width="0.5"
  />

  <!-- Radiant inner highlights -->
  <line
    x1="16"
    y1="7"
    x2="16"
    y2="14.5"
    stroke="#e0e7ff"
    stroke-width="0.75"
    stroke-linecap="round"
    opacity="0.85"
  />
  <line
    x1="16"
    y1="17"
    x2="16"
    y2="26"
    stroke="#a5f3fc"
    stroke-width="0.75"
    stroke-linecap="round"
    opacity="0.9"
  />
</svg>
