name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tetra
          POSTGRES_PASSWORD: tetra_ci
          POSTGRES_DB: tetra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tetra"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://tetra:tetra_ci@localhost:5432/tetra
      AUTH_SECRET: ci-secret-0123456789abcdef0123456789
      DEFAULT_TIMEZONE: Asia/Jakarta
      ALLOW_DEV_LOGIN: "true"
    steps:
      - uses: actions/checkout@v5
      # pnpm version comes from package.json "packageManager" — single
      # source of truth; specifying "version" here too makes the action fail.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm build
      - name: Install Playwright chromium
        run: pnpm exec playwright install chromium --with-deps
      - run: pnpm test:e2e
